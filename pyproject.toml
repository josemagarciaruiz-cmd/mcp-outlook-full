[project]
name = "outlook-mcp"
version = "0.1.0"
description = "Servidor MCP para correo y calendario de Outlook / Microsoft 365 (Microsoft Graph)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.6.0",
]

[project.scripts]
outlook-mcp = "outlook_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outlook_mcp"]
